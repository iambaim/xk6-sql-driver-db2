name: CI

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref or commit to test
        required: true
        type: string
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  build-with-xk6:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # IBM's Linux CLI driver requires libxml2.so.2, available on Ubuntu 24.04.
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: Setup Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6
        with:
          go-version: '1.26.x'
          cache: false
      - name: Setup xk6
        if: runner.os == 'Windows'
        uses: grafana/setup-xk6@97b842b765bd3fea56db7195e98c5f61cab8fe46 # v1.1.1
        with:
          xk6-version: "1.5.1"
          dir: "/mingw64/bin"
      - name: Setup xk6
        if: runner.os != 'Windows'
        uses: grafana/setup-xk6@97b842b765bd3fea56db7195e98c5f61cab8fe46 # v1.1.1
        with:
          xk6-version: "1.5.1"
      - name: Install DB2 runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2
        shell: bash
      - name: Install DB2 CLI driver
        id: db2
        run: make setup-db2 2>&1 | tee db2.log
        shell: bash
      - name: Build k6
        id: build
        run: make -o setup-db2 build 2>&1 | tee build.log
        shell: bash
      - name: Check k6 module loading
        id: smoke
        run: make check-module-loading 2>&1 | tee smoke.log
        shell: bash
      - name: Test against DB2
        if: runner.os == 'Linux'
        id: integration
        run: make container-test 2>&1 | tee integration.log
        shell: bash
      - name: Report CI failure
        if: failure()
        env:
          DB2_OUTCOME: ${{ steps.db2.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          INTEGRATION_OUTCOME: ${{ steps.integration.outcome }}
        run: |
          if [[ "$DB2_OUTCOME" == failure ]]; then
            log=db2.log
          elif [[ "$BUILD_OUTCOME" == failure ]]; then
            log=build.log
          elif [[ "$SMOKE_OUTCOME" == failure ]]; then
            log=smoke.log
          elif [[ "$INTEGRATION_OUTCOME" == failure ]]; then
            log=integration.log
          else
            exit 0
          fi
          detail=$(tail -n 20 "$log")
          detail=${detail//'%'/'%25'}
          detail=${detail//$'\r'/'%0D'}
          detail=${detail//$'\n'/'%0A'}
          printf '::error title=CI failure in %s::%s\n' "$log" "$detail"
        shell: bash
