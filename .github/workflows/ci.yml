name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  build-with-xk6:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6
        with:
          go-version: '1.26.x'
          cache: false
      - name: Setup xk6
        if: runner.os == 'Windows'
        uses: grafana/setup-xk6@97b842b765bd3fea56db7195e98c5f61cab8fe46 # v1.1.1
        with:
          xk6-version: "1.5.1"
          dir: "/mingw64/bin"
      - name: Setup xk6
        if: runner.os != 'Windows'
        uses: grafana/setup-xk6@97b842b765bd3fea56db7195e98c5f61cab8fe46 # v1.1.1
        with:
          xk6-version: "1.5.1"
      - name: Build and check k6 module loading
        run: make smoke-test
        shell: bash
      - name: Test
        if: runner.os == 'Linux'
        run: make container-test
        shell: bash
